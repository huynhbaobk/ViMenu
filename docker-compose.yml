services:
  app:
    build: .
    ports:
      - "8080:8000"  # Changed to avoid conflict with external OCR on 8000
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-development_secret_key_minimum_32_chars_long}
      - OCR_API_URL=${OCR_API_URL:-http://host.docker.internal:8000}
      - REDIS_URL=redis://redis:6379
      - HF_API_TOKEN=${HF_API_TOKEN:-mock}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-mock}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID:-mock}
      - USE_MOCK_SERVICES=${USE_MOCK_SERVICES:-false}
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - vimenu-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - vimenu-network

volumes:
  redis_data:

networks:
  vimenu-network:
    driver: bridge